name: TelegramGlass

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Native C++ (JNI/CMake) Build
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
            TMessagesProj/build/intermediates/cmake
          key: ${{ runner.os }}-native-cxx-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt') }}

      - name: Generate dummy google-services.json if missing
        run: |
          cat << 'EOF' > TMessagesProj/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "firebase_url": "https://telegram-glass.firebaseio.com",
              "project_id": "telegram-glass",
              "storage_bucket": "telegram-glass.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1111111111111111",
                  "android_client_info": { "package_name": "org.telegram.messenger" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalCompilation0000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:2222222222222222",
                  "android_client_info": { "package_name": "org.telegram.messenger.beta" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalCompilation0000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:3333333333333333",
                  "android_client_info": { "package_name": "org.telegram.messenger.web" }
                },
                "api_key": [{ "current_key": "AIzaSyDummyKeyForLocalCompilation0000000" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          if [ -d "TMessagesProj_App" ]; then
            cp TMessagesProj/google-services.json TMessagesProj_App/google-services.json
          fi

      - name: Generate release.keystore automatically
        run: |
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/release.keystore
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias alias_tgglass -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 37130506 -keypass 37130506 \
            -dname "CN=Telegram, OU=Android, O=Telegram, L=Dubai, S=Dubai, C=AE"
          echo "" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=123456" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=alias_name" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=123456" >> gradle.properties
          echo "android.injected.testOnly=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleAfatDebug --build-cache --parallel

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramGlass-APK
          path: |
            **/*.apk